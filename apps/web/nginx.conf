server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Desenhos CAD sao grandes; acompanha o limite de 25 MB do backend.
  client_max_body_size 30m;

  # API: encaminha para o container do backend (mesma origem para o navegador).
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Assets versionados do editor podem ser cacheados agressivamente.
  location /app/assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Editor (SPA) servido sob /app; rotas desconhecidas caem no index do app.
  location = /app { return 301 /app/; }
  location /app/ {
    try_files $uri $uri/ /app/index.html;
  }

  # Site institucional estatico na raiz, com URLs limpas (/entrar, /termos...).
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
