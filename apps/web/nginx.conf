server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Desenhos CAD sao grandes; acompanha o limite de 25 MB do backend.
  client_max_body_size 30m;

  # Encaminha a API para o container do backend (mesma origem para o navegador).
  location /api/ {
    proxy_pass http://api:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA: qualquer rota desconhecida cai no index.html (roteamento no cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }
}
