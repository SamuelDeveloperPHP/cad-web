# Sobe a stack completa com Docker: web (Nginx) + API + PostgreSQL + Redis.
# Funciona em qualquer host com Docker; o provedor final pode ser escolhido depois.
#   docker compose up --build   ->  app em http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cad
      POSTGRES_PASSWORD: cad
      POSTGRES_DB: cad_web
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cad -d cad_web']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3333'
      DATABASE_URL: postgres://cad:cad@db:5432/cad_web
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      # Troque por um segredo forte e secreto em producao real.
      JWT_SECRET: ${JWT_SECRET:-troque-este-segredo-em-producao-0123456789}
    # Aplica as migrations e so entao sobe o servidor.
    command: sh -c "node dist/db/migrate.js && node dist/server.js"
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy

  # SPA servido por Nginx, que faz proxy de /api para a API (mesma origem).
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  pgdata:
